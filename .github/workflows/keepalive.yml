name: Supabase Keep-Alive

on:
  schedule:
    # Пн и Чт в 09:00 UTC (04:00 в Arequipa) — раз в 3-4 дня, с запасом до 7-дневного лимита
    - cron: '0 9 * * 1,4'
  workflow_dispatch: {}   # позволяет запустить вручную из вкладки Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase reclamaciones table
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/reclamaciones?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Supabase respondió con error $HTTP_STATUS — revisar RLS o credenciales"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
