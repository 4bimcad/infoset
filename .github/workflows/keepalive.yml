name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 9 * * 1,4'   # Пн и Чт, 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write   # нужно, чтобы workflow мог коммитить

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase reclamaciones table
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/reclamaciones?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json
          if [ "$HTTP_STATUS" -ge 400 ] || [ "$HTTP_STATUS" -eq 000 ]; then
            echo "::error::Supabase respondió con error $HTTP_STATUS"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit heartbeat (keeps repo "active" for GitHub cron)
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-ping.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          git add .keepalive/last-ping.txt
          git diff --cached --quiet || git commit -m "chore: keepalive ping"
          git push