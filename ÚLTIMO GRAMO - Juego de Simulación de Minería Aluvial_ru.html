<style>
:root{--bg:#121a14;--pn:#1b2e22;--ln:#3d6b4a;--am:#e3a82b;--tx:#e8dec2;--dm:#8fa68f;--rd:#e0714f;--gn:#86cc88;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;font-family:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.4 "XMind","Xmind","XMind Sans",Inter,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
.n{font-weight:700}
.ttl{font-weight:700;color:var(--am);letter-spacing:1px}
#top{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:6px 10px;background:var(--pn);border-bottom:2px solid var(--ln)}
.rt{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
#pn{color:var(--am);margin-left:10px}
button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);padding:3px 10px;cursor:pointer}
button:hover:not(:disabled),button.on{background:var(--am);color:var(--bg)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--am);outline-offset:1px}
#mid{flex:1;display:flex;min-height:0}
#menu{width:170px;padding:8px;border-right:2px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;gap:5px}
#menu button{text-align:left}
#main{flex:1;padding:10px 14px;overflow:auto}
h2{color:var(--am);font-weight:normal;margin:0 0 10px;font-size:24px;border-bottom:1px solid var(--ln)}
table{border-collapse:collapse;width:100%;max-width:680px}
td,th{padding:4px 8px 4px 0;border-bottom:1px solid rgba(143,166,143,.32);text-align:left;font-weight:normal;vertical-align:top}
th{color:var(--am)}
.r{text-align:right}.g{color:var(--gn)}.d{color:var(--rd)}.m{color:var(--dm)}
#bar{padding:5px 10px;background:var(--pn);border-top:2px solid var(--ln);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:14px}
#box{background:var(--pn);border:3px double var(--am);max-width:580px;width:100%;padding:14px;max-height:100%;overflow:auto}
#box h3{color:var(--am);font-weight:normal;margin:0 0 6px;font-size:22px}
#box button{display:block;width:100%;text-align:left;margin-top:6px;padding:4px 9px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--am);padding:3px 8px;width:100%}
p{margin:10px 0}
.hp{margin:16px 0 8px;padding-top:10px;border-top:1px solid var(--ln);color:#a9bfa6;line-height:1.5}
.hp b{color:var(--tx)}
canvas{width:100%;max-width:680px;height:230px;border:1px solid var(--ln);display:block}
@media(max-width:640px){#mid{flex-direction:column}#menu{width:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px solid var(--ln)}.rt{margin-left:0}}

.ic{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;margin-right:6px;flex:none}
.lg{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.4)}
#bar{display:flex;align-items:center;justify-content:space-between;gap:14px}
#bt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar a{flex:none;font-size:10px;color:var(--dm);text-decoration:none;opacity:.8}
#bar a:hover{color:var(--am);opacity:1}
@keyframes fl{0%{background:#ffd34d;color:#121a14}60%{background:#e3a82b;color:#121a14}100%{background:var(--pn);color:var(--tx)}}
#bar.fl{animation:fl 2s ease-out}
.pmw{position:relative}
#pm{display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--pn);border:1px solid var(--am);z-index:30;min-width:210px;padding:4px}
#pm.open{display:block}
#pm button{display:block;width:100%;text-align:left;margin:2px 0}
#box.big{max-width:780px}
.stt{width:100%;max-width:none;margin:10px 0;border:1px solid var(--ln)}
.stt caption{color:var(--am);text-align:left;padding:5px 8px;background:var(--bg);font-weight:bold}
.stt td{border-bottom:0;padding:4px 8px;border-top:1px solid var(--ln)}
.stt td:last-child{text-align:right;white-space:nowrap}
#menu button,.rt button,#pm button{display:flex;align-items:center}
</style>
</head>

const MN=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

function beep(k){if(!SND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();const t=AC.currentTime,seq={n:[[660,.09]],e:[[523,.1],[784,.16]],w:[[880,.09],[1175,.14]],l:[[392,.14],[294,.24]]}[k]||[[660,.09]];seq.forEach((s,i)=>{const o=AC.createOscillator(),g=AC.createGain(),a=t+i*.13;o.type="triangle";o.frequency.value=s[0];g.gain.setValueAtTime(.0001,a);g.gain.exponentialRampToValueAtTime(.16,a+.01);g.gain.exponentialRampToValueAtTime(.0001,a+s[1]);o.connect(g);g.connect(AC.destination);o.start(a);o.stop(a+s[1]+.03)})}catch(e){}}
function flash(){try{const b=$("#bar");if(b&&b.classList){b.classList.remove("fl");void b.offsetWidth;b.classList.add("fl")}}catch(e){}}
function news(t,k){const d=dt();S.news.unshift({d:pad(d.getUTCDate())+" "+MN[d.getUTCMonth()]+" "+d.getUTCFullYear(),t});S.news.length=Math.min(S.news.length,80);flash();beep(k||"n")}
function debt(){return S.loans.reduce((a,l)=>a+l.p,0)}
/* ===== ИМУЩЕСТВО И АКТИВЫ ===== */
const hPrice=i=>HS[i][1]*idx()*S.hv,cPrice=i=>CS[i][1]*idx(),cVal=o=>CS[o.i][1]*idx()*Math.max(.25,Math.pow(.88,(S.day-o.d)/365.25));
function pres(){return Math.min(25,S.ph.reduce((a,i)=>a+HS[i][2],0)+S.pc.reduce((a,o)=>a+CS[o.i][2],0))}
function houseVal(){return S.ph.reduce((a,i)=>a+hPrice(i)*.92,0)}
function propVal(){return houseVal()+S.pc.reduce((a,o)=>a+cVal(o)*.85,0)}
function eqVal(){const c=S.cond,s=c.exc+c.pump+c.slu+c.gen+(S.cf?c.cf:0);return S.inv*(.3+.6*s/((S.cf?5:4)*100))}
function siteVal(){return .045*S.res*S.grade*Rf()*S.price}
function nwv(){return S.cash-debt()+S.hg*S.price*(1-S.spr)+S.hs*S.sv*(1-S.spr*1.5)+propVal()+eqVal()+siteVal()}
function buyH(i){const c=hPrice(i)*1.03;if(S.ph.includes(i)||S.cash<c)return;S.cash-=c;S.ph.push(i);S.xs.pb++;news('Куплен дом: '+HS[i][0]+' ('+money(c)+').');render()}
function sellH(i){const k=S.ph.indexOf(i);if(k<0)return;const c=hPrice(i)*.92;S.cash+=c;S.ph.splice(k,1);news('Продан дом: '+HS[i][0]+' ('+money(c)+').');render()}
function buyC(i){const c=cPrice(i);if(S.pc.some(o=>o.i==i)||S.cash<c)return;S.cash-=c;S.pc.push({i,d:S.day});S.xs.pb++;news('Куплена машина: '+CS[i][0]+' ('+money(c)+').');render()}
function sellC(i){const k=S.pc.findIndex(o=>o.i==i);if(k<0)return;const c=cVal(S.pc[k])*.85;S.cash+=c;S.pc.splice(k,1);news('Продана машина: '+CS[i][0]+' ('+money(c)+').');render()}
function monthProp(){S.hv=Math.max(.6,Math.min(1.8,S.hv*.97+.03+(rnd()-.5)*.06));let u=0;for(const i of S.ph)u+=hPrice(i)*.003;for(const o of S.pc)u+=cVal(o)*.01;S.cash-=u;S.upk=u}
/* ===== СКЛАД, РЫНОК ===== */
const qt=m=>{const g=m=="g",p=g?S.price:S.sv,k=g?1:1.5;return{p,ask:p*(1+S.spr*k),bid:p*(1-S.spr*k),k}};
function stAdd(m,q,p){const h=m=="g"?"hg":"hs";S.av[m]=(S.av[m]*S[h]+p*q)/((S[h]+q)||1);S[h]+=q}
function stSell(m,q,p){const h=m=="g"?"hg":"hs";q=Math.min(q,S[h]);if(q<=0)return 0;S.xs.rp+=(p-S.av[m])*q;S[h]-=q;S.ls[m]=p;S.xs.ts+=q*p;return q}
function trade(m,sd,q){const Q=qt(m),h=m=="g"?"hg":"hs";if(sd=="b"){const c=q*Q.ask;if(S.cash>=c){S.cash-=c;stAdd(m,q,Q.ask);S.lb[m]=Q.ask;S.xs.tb+=c}}else{const s=stSell(m,q,Q.bid);S.cash+=s*Q.bid}render()}
function acceptOffer(){const o=S.offer;if(!o)return;const w=o.m=="g"?"золота":"серебра",h=o.m=="g"?"hg":"hs";if(o.buy){const c=o.g*o.p;if(S.cash>=c){S.cash-=c;stAdd(o.m,o.g,o.p);S.lb[o.m]=o.p;S.xs.tb+=c;news("Куплено у дилера: "+grp(o.g)+" г "+w+" за "+money(c)+".");S.offer=null}}else if(S[h]>=o.g){const s=stSell(o.m,o.g,o.p);S.cash+=s*o.p;news("Продано дилеру: "+grp(s)+" г "+w+" за "+money(s*o.p)+".");S.offer=null}render()}
function sellAllG(){trade('g','s',1e12)}
function togAuto(){S.auto=S.auto?0:1;render()}
/* ===== МАСШТАБ СОБЫТИЙ ===== */
function sc(){return Math.max(1,Math.pow(Math.min(S.V,capN())/150,.85))}
function ek(){return idx()*sc()}
function scaleTxt(s){const k=ek();return s.replace(/\$(\d{1,3}(?:,\d{3})+|\d{2,})(?![\d.,]*\/|\d)/g,(m,a)=>{const n=+a.replace(/,/g,"");return n>=20?money(n*k):m})}
/* ===== ТИК ===== */
function tick(){
 S.day++;const d=dt(),X=S.xs;
 S.noise=S.noise*.97+(rnd()-.5)*.08;S.ns=S.ns*.96+(rnd()-.5)*.14;
 S.mg=1+(S.mg-1)*.985;S.ms=1+(S.ms-1)*.985;
 S.price=bp(ANCH)*Math.exp(S.noise)*S.mg;S.sv=bp(SANCH)*Math.exp(S.ns)*S.ms;
 let m=1;if(S.pmd>0){m=S.pm;S.pmd--}if(S.st.mor<30)m*=.9;if(Object.keys(S.br).some(k=>S.br[k]))m*=.5;
 let V=S.stop?0:Math.min(S.V,capN(),S.res)*m*crewM()*(.9+rnd()*.2);V=Math.min(V,S.res);
 const gm=rnd()<.05?1.8+rnd()*.6:rnd()<.1?.4+rnd()*.3:.85+rnd()*.3,R=Rf(),g=V*S.grade*gm*R;
 S.res-=V;S.tot+=g;S.lastG=g;if(V>0)X.dr++;else X.ds++;
 const pp=S.price*(1-S.disc/100),val=g*pp;
 const f=V/200,fuel=195*.45*S.fm*f,cons=(47+(S.cf?30:0))*f;
 const cost=(S.res<=0||S.stop?12*tm():fuel+cons+S.n*S.w+S.lab+40*tm()+25*(S.tier+1))*idx();
 const tax=.08*val,inc=S.auto?val:0;if(!S.auto&&g>0)stAdd("g",g,pp);
 S.sold+=inc;S.lastTax=tax;S.pr=val-tax-cost;S.cash+=inc-tax-cost;X.taxp+=tax;X.costp+=cost;
 if(S.cash<0&&S.hg>0){const bid=S.price*(1-S.spr),q=stSell("g",-S.cash/bid,bid);S.cash+=q*bid;if(q>0&&S.day-S.fl>14){S.fl=S.day;X.fsn++;news("Не хватило денег: со склада принудительно продано "+dec(q,1)+" г золота.","w")}}
 if(S.cash>X.mxc)X.mxc=S.cash;
 if(S.fmd>0&&--S.fmd==0)S.fm=1;if(S.dd>0&&--S.dd==0)S.disc=0;
 if(V>0){for(const k in EQ){if(k=="cf"&&!S.cf)continue;S.cond[k]=Math.max(0,S.cond[k]-EQ[k].wear*V/capN());const p=(1/EQ[k].mtbf)*(1+4*(1-S.cond[k]/100));if(!S.br[k]&&!S.q.some(e=>e.id=="f:"+k)&&rnd()<p){S.q.push({id:"f:"+k});X.brk++}}}
 else if(S.res<=0&&!S.flagEnd){S.flagEnd=1;news("Запасы участка исчерпаны. Нужен новый участок.","w")}
 S.sch=S.sch.filter(e=>{if(e.d<=S.day){S.q.push({id:e.id});return false}return true});
 if(rnd()<1/35){const mo=d.getUTCMonth()+1;const pool=EV.filter(e=>e.w>0&&(S.cd[e.id]||0)<=S.day&&(!e.rq||(e.rq=="car"?S.pc.length:S.ph.length))&&(!e.m||(e.m[0]<=e.m[1]?mo>=e.m[0]&&mo<=e.m[1]:mo>=e.m[0]||mo<=e.m[1])));let tw=pool.reduce((a,e)=>a+e.w,0),r=rnd()*tw;for(const e of pool){if((r-=e.w)<0){S.q.push({id:e.id});S.cd[e.id]=S.day+200;break}}}
 if(V>0&&rnd()<(1/700)*(1+Math.max(0,50-S.st.saf)/25))S.q.push({id:"acc"});
 if(S.st.mor<20&&(S.cd.paro||0)<=S.day){S.q.push({id:"paro"});S.cd.paro=S.day+120}
 if(d.getUTCDate()==1){S.hist.push(S.price);S.hists.push(S.sv);S.spr=.015+rnd()*.04;newOffer();genSite();payLoans();monthStaff();monthProp();X.pnw=Math.max(X.pnw,nwv())}
 if(S.day%30==0)save(true);
 if(S.cash<-15000*tm())S.over="Bankruptcy";if(S.miss>=3)S.over="Debt Trap";
 if(d.getTime()>=END){const nw=nwv();X.pnw=Math.max(X.pnw,nw);S.over=nw>5e7?"Mining Empire":nw>6e6?"Successful Business":nw>0?"Survivor":S.miss>0?"Debt Trap":"Bankruptcy"}
 if(S.over){beep("l");return}
 if(S.q.length)openEv(S.q.shift());
}
function fx(f){const k=ek();
 for(const a in f){const v=f[a];
  if(a=="cash")S.cash+=v*k;else if(a=="cashx")S.cash+=v;else if(a=="gold"){stAdd("g",v,S.price)}
  else if(a=="cond"){for(const i in v)S.cond[i]=typeof v[i]=="string"?+v[i].slice(4):Math.max(0,Math.min(100,S.cond[i]+v[i]))}
  else if(a=="pm"){S.pm=v.v;S.pmd=v.d}else if(a=="fuel"){S.fm=v.v;S.fmd=v.d}else if(a=="disc"){S.disc=v.v;S.dd=v.d}
  else if(a=="lab")S.lab+=v;else if(a=="flag"){}else if(a=="br")S.br[v]=true;else if(a=="unbr")S.br[v]=false;
  else if(a=="wage")S.w=Math.min(24,S.w+v);else if(a=="crew"){S.sk=(S.sk*S.n+20*v)/(S.n+v);S.st.saf=(S.st.saf*S.n+30*v)/(S.n+v);S.n+=v}else if(a=="fire"){S.n=Math.max(0,S.n-v)}else if(a=="sk"){S.sk=Math.max(10,Math.min(100,S.sk+v))}
  else if(a=="grade")S.grade+=v;else if(a=="resp")S.res*=1+v/100;
  else if(a=="px"){if(v.g)S.mg*=v.g;if(v.s)S.ms*=v.s}
  else if(a=="buyg"||a=="buys"){const A=v*k,gd=a=="buyg",Q=qt(gd?"g":"s");if(S.cash>=A){S.cash-=A;stAdd(gd?"g":"s",A/Q.ask,Q.ask);S.lb[gd?"g":"s"]=Q.ask;S.xs.tb+=A;news("Куплено на рынке: "+money(A)+" ("+(gd?"золото":"серебро")+").")}}
  else if(a=="loan"){const A=v*k,r=.01;S.cash+=A;S.loans.push({p:A,r,pay:A*r/(1-Math.pow(1+r,-36)),n:36});S.xs.lt++;S.xs.ltv+=A;news("Инвестор выдал заём "+money(A)+" под 12% на 36 мес.")}
  else if(["mor","rep","com","saf"].includes(a)){S.st[a]=Math.max(0,Math.min(100,S.st[a]+v))}
  else if(a=="ch")fx(rnd()<v.p?v.a:v.b);
  else if(a=="sch"){if(rnd()<v.p)S.sch.push({id:v.id,d:S.day+Math.round(v.d[0]+rnd()*(v.d[1]-v.d[0]))})}}}
/* ===== КАДРЫ, БАНК ===== */
function need(){return Math.ceil(Math.min(S.V,capN())/TIER[S.tier].w)}
function crewM(){return Math.min(1,S.n/need())*(1+(S.sk-40)/500)}
function Rf(){return S.cf?.6+.24*(.5+.5*S.cond.cf/100):.6}
function est(V){const R=Rf(),f=V/200,rev=V*crewM()*S.grade*R*S.price*(1-S.disc/100);return rev*.92-((195*.45*S.fm+47+(S.cf?30:0))*f+S.n*S.w+S.lab+40*tm()+25*(S.tier+1))*idx()}
function monthStaff(){const t=60+(S.w/12-1)*60;S.st.mor=Math.max(0,Math.min(100,S.st.mor+(t-S.st.mor)*.1));let q=0;for(let i=0;i<S.n;i++)if(rnd()<.02*(1+Math.max(0,50-S.st.mor)/25))q++;if(q){S.n-=q;S.sk=Math.max(10,S.sk-q);S.st.saf=Math.max(0,S.st.saf-q*.8);news("Уволились рабочие: "+q+". Вместе с ними ушёл опыт: упали квалификация и безопасность.","w")}S.st.saf=Math.max(0,S.st.saf-.4);if(!S.stop&&S.res>0)S.sk=Math.min(100,S.sk+.5)}
function hire(k){const c=20*k*idx();if(S.cash>=c){S.cash-=c;S.sk=(S.sk*S.n+20*k)/(S.n+k);S.st.saf=(S.st.saf*S.n+30*k)/(S.n+k);S.n+=k}render()}
function fire(k){k=Math.min(k,S.n);S.n-=k;S.st.mor=Math.max(0,S.st.mor-2*k);render()}
function train(){const c=S.n*15*idx();if(S.cash>=c){S.cash-=c;S.sk=Math.min(100,S.sk+10);S.st.mor=Math.min(100,S.st.mor+2)}render()}
function ppe(){const c=300*idx()*tm();if(S.cash>=c){S.cash-=c;S.st.saf=Math.min(100,S.st.saf+10)}render()}
function wage(d){S.w=Math.max(6,Math.min(24,S.w+d));render()}
function rate(){const y=1990+S.day/365.25,A=[[1990,.24],[1995,.2],[2000,.16],[2010,.11],[2020,.08]];let b=.08;for(let i=1;i<A.length;i++)if(y<=A[i][0]){b=A[i-1][1]+(A[i][1]-A[i-1][1])*(y-A[i-1][0])/(A[i][0]-A[i-1][0]);break}return b+Math.max(0,100-S.st.rep-pres())/1000}
function limit(){return Math.max(0,Math.round(25000*idx()*tm()*(.4+(S.st.rep+pres())/100)*(S.res<=0?.5:1)+.5*houseVal()-debt()))}
function amt(a){return Math.round(a*idx()*tm()/500)*500}
function lq(a,n){const r=rate()/12,pay=a*r/(1-Math.pow(1+r,-n));return{pay,tot:pay*n,over:pay*n-a,pc:(pay*n/a-1)*100}}
function setTerm(t){S.term=t;render()}
function borrow(a){if(a>limit())return;const r=rate()/12,n=S.term,pay=a*r/(1-Math.pow(1+r,-n));S.cash+=a;S.loans.push({p:a,r,pay,n});S.xs.lt++;S.xs.ltv+=a;news("Взят кредит "+money(a)+" на "+n+" мес. под "+dec(rate()*100,1)+"% годовых.");render()}
function repay(i){const l=S.loans[i];if(l&&S.cash>=l.p){S.cash-=l.p;S.loans.splice(i,1);news("Кредит погашен досрочно.")}render()}
function payLoans(){let missed=0;S.loans=S.loans.filter(l=>{const it=l.p*l.r,pay=Math.min(l.pay,l.p+it);if(S.cash>=pay){S.cash-=pay;l.p-=pay-it;l.n=Math.max(0,l.n-1)}else{l.p+=it+pay*.05;missed=1;S.st.rep=Math.max(0,S.st.rep-5)}return l.p>1});S.miss=missed?S.miss+1:0;if(missed)news("Платёж по кредиту просрочен! Штраф 5%, репутация падает. Просрочек подряд: "+S.miss+" из 3.","w")}
function setV(d){S.V=Math.max(50,Math.min(3000,S.V+d));render()}
function tog(){S.stop=S.stop?0:1;news(S.stop?"Участок остановлен. Бригада распущена, остаётся охрана.":"Участок запущен.");render()}
function repairBroken(k){const c=EQ[k].ma*.55*idx()*tm();if(!S.br[k]||S.cash<c)return;S.cash-=c;S.br[k]=false;S.cond[k]=90;S.pm=0;S.pmd=3;news("Отремонтирована: "+EQ[k].n+". Три дня простоя, пока ждали запчасти.");render()}
function maint(k){if(S.br[k])return;const c=EQ[k].mi*.5*idx()*tm();if(S.cash>=c){S.cash-=c;S.cond[k]=Math.min(100,S.cond[k]+30)}render()}
function buyCF(){const c=2.5e4*idx();if(!S.cf&&S.cash>=c){S.cash-=c;S.inv+=c;S.cf=1;S.cond.cf=100;news("Центробежный концентратор установлен: извлечение до 84%. Ему тоже нужны обслуживание и ремонт.")}render()}
function upTier(){const T=TIER[S.tier+1];if(!T)return;const c=T.p*idx();if(S.cash>=c){S.cash-=c;S.inv+=c;S.tier++;for(const k in S.cond)S.cond[k]=100;S.br={};news("Линия модернизирована: до "+grp(T.c)+" м³/день. Нужен 1 рабочий на "+T.w+" м³.")}render()}
function buySite(){const s=S.site;if(!s||S.cash<s.p)return;S.cash-=s.p;const g=s.g*(.85+rnd()*.3);S.grade=(S.res*S.grade+s.r*g)/(S.res+s.r);S.res+=s.r;S.flagEnd=0;S.xs.sb++;news("Куплен участок: +"+grp(s.r)+" м³. Содержание после разведки: "+dec(g)+" г/м³.");genSite();render()}

 let ev;

function bar(v){const n=Math.round(v/10);return "█".repeat(n)+"░".repeat(10-n)}

 for(const t of a){const s=t.nodeValue;if(!/\d/.test(s))continue;const f=document.createDocumentFragment();let i=0;
  s.replace(/[−+]?\$?\d(?:[\d.,]*\d)?%?/g,(m,o)=>{f.append(s.slice(i,o));const e=document.createElement("span");e.className="n";e.textContent=m;f.append(e);i=o+m.length;return m});
  f.append(s.slice(i));t.replaceWith(f)}}

латежа подряд, и банк забирает компанию за долги.")}
 else if(S.tab=="pp"){const row=(n,p,pr,own,b,s)=>"<tr><td>"+n+"</td><td class='r'>"+money(p)+"</td><td class='r'>+"+pr+"</td><td>"+(own?"<button onclick='"+s+"'>Продать</button>":"<button onclick='"+b+"'"+(S.cash<p?" disabled":"")+">Купить</button>")+"</td></tr>",th="<tr><th>Объект</th><th class='r'>Цена</th><th class='r'>Престиж</th><th></th></tr>";
  h=hd("house","Имущество")+"<table>"+tr("Стоимость имущества",money(propVal()))+tr("Престиж",pres()+" из 25")+tr("Содержание в месяц",money(S.upk||0))+tr("Рынок недвижимости","×"+dec(S.hv))+"</table>"+hp("<b>Престиж</b> — чем дороже ваше имущество, тем охотнее банк даёт кредиты: растёт лимит и снижается ставка (максимум 25 очков). Дома ещё и залог: банк добавляет к лимиту 50% их стоимости.<br>Цены домов меняются вместе с рынком недвижимости (множитель выше), а машины каждый год дешевеют примерно на 12%. При продаже теряется 8–15% цены. Содержание списывается раз в месяц.")+"<h2 style='margin-top:12px'>"+ic("house")+"Дома</h2><table>"+th+HS.map((x,i)=>row(x[0],hPrice(i)*1.03,x[2],S.ph.includes(i),"buyH("+i+")","sellH("+i+")")).join("")+"</table><h2 style='margin-top:12px'>"+ic("car-side")+"Машины</h2><table>"+th+CS.map((x,i)=>row(x[0],cPrice(i),x[2],S.pc.some(o=>o.i==i),"buyC("+i+")","sellC("+i+")")).join("")+"</table>"}
 else if(S.tab=="mk"){const g=S.mm=="g",Q=qt(S.mm),M=mstats(S.mm),hh=g?S.hg:S.hs,m=S.mm,lots=g?[10,100,1000]:[100,1000,10000],o=S.offer,av=S.av[m],pl=hh*(Q.bid-av),chg=M.prev?(M.cur/M.prev-1)*100:0;
  const lg=(c,t)=>"<span class='lg' style='background:"+c+"'></span>"+t;

  +"<p>"+lg("#fff1a8","Сейчас <b>$"+dec(M.cur)+"</b>")+" &nbsp; "+lg("#6fc3d8","Прошлый месяц <b>$"+dec(M.prev)+"</b> ("+(chg>=0?"+":"")+dec(chg,1)+"%)")+"<br>"+lg("#86cc88","▲ Максимум за 24 месяца <b>$"+dec(M.H[M.hi])+"</b> ("+M.hiL+")")+" &nbsp; "+lg("#e0714f","▼ Минимум <b>$"+dec(M.H[M.lo])+"</b> ("+M.loL+")")+"</p><canvas id='cv' width='680' height='270'></canvas>"+hp("<b>Как читать таблицу.</b> «Купить по» — цена, по которой вы покупаете металл, «Продать по» — цена, по которой продаёте. Разница между ними (спред) — комиссия рынка, она меняется каждый месяц. <b>Средняя цена запаса</b> учитывает и ваши покупки, и вашу добычу.<br><b>График.</b> Каждый столбик — цена за грамм в начале месяца, последний — текущая. Пунктирные линии показывают цены вашей последней покупки и продажи.<br><b>Дилер</b> раз в месяц предлагает один случайный лот: он может быть дешевле или дороже рынка.")}
 else h=hd("newspaper","Новости")+"<table>"+S.news.map(n=>"<tr><td class='m' style='white-space:nowrap'>"+n.d+"</td><td>"+esc(n.t)+"</td></tr>").join("")+"</table>"+hp("Здесь все сообщения компании, самые новые вверху.");
 $("#main").innerHTML=h;numfy($("#main"));
 if(S.tab=="mk"&&!S.over)chart();

let last=performance.now(),acc=0;
function loop(t){const dl=Math.min(t-last,5000);last=t;if(run()){acc+=dl*S.spd;let n=0;while(acc>=1500&&run()&&n++<400){acc-=1500;tick()}if(n)render(0)}else acc=0;requestAnimationFrame(loop)}
document.addEventListener("keydown",e=>{if(e.code=="Space"&&!S.modal){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();togglePause()}});
document.addEventListener("keyup",e=>{if(e.code=="Space"&&!S.modal)e.preventDefault()});
