const D0=Date.UTC(1990,0,1),END=Date.UTC(2020,0,1);
const MN=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

]},{"id":"pep","t":"La pepita de la bota","w":3,"x":"Un trabajador encontró en el descarte una pepita de 30 gramos y la escondió en su bota izquierda. Ahora cojea de la pierna izquierda y evita mirarte a los ojos.","o":[{"l":"Bono de $100 y la pepita a la caja","f":{"cash":-100,"gold":30,"mor":6}},{"l":"Revisar a todos","f":{"gold":30,"mor":-10}},{"l":"Hacer la vista gorda","f":{"mor":3}}]},{"id":"fie","t":"Fiesta del Patrón","w":8,"m":[5,5],"x":"En el pueblo es la fiesta del santo patrono. La mitad de la cuadrilla se fue a misa y la otra mitad decide cómo despedirlos dignamente.","o":[{"l":"Tres días libres y una mesa de fiesta ($200)","f":{"cash":-200,"pm":{"v":0,"d":3},"mor":8}},{"l":"Un día libre y una oración tranquila ($60)","f":{"cash":-60,"pm":{"v":0,"d":1},"mor":2}},{"l":"Sin fiestas","f":{"mor":-10}}]},{"id":"viz","t":"La zarigüeya del generador","w":3,"x":"Una zarigüeya decidió que los cables del generador fueron hechos para ella. Ahora la luz del campamento parpadea y la zarigüeya está muy contenta.","o":[{"l":"Repararlo de inmediato ($150)","f":{"cash":-150,"cond":{"gen":"set:90"}}},{"l":"Trabajar a la luz de las velas","f":{"pm":{"v":0.85,"d":10},"cond":{"gen":-20}}}]},{"id":"rio","t":"El río crece","w":7,"m":[12,3],"x":"Por la noche llovió en la parte alta. Por la mañana tu tajo parece una piscina y los trabajadores, turistas.","o":[{"l":"Sacar el agua con la bomba ($300, 4 días)","f":{"cash":-300,"pm":{"v":0,"d":4},"cond":{"pump":-8}}},{"l":"Esperar a que baje (10 días)","f":{"pm":{"v":0,"d":10}}}]},{"id":"com","t":"Los burros de la comunidad","w":4,"x":"El agua del arroyo se volvió color chocolate. El anciano de la comunidad llegó con un burrito y una lista de reclamos certificada por un notario.","o":[{"l":"Indemnización de $400","f":{"cash":-400,"com":10}},{"l":"Contratar a dos de la comunidad para la cuadrilla","f":{"crew":2,"com":8}},{"l":"Negarse","f":{"com":-15,"ch":{"p":0.4,"a":{"pm":{"v":0,"d":10},"rep":-5},"b":{}}}}]},{"id":"der","t":"Derru   +"<p>"+lg("#fff1a8","Ahora <b>$"+dec(M.cur)+"</b>")+" &nbsp; "+lg("#6fc3d8","Mes pasado <b>$"+dec(M.prev)+"</b> ("+(chg>=0?"+":"")+dec(chg,1)+"%)")+"<br>"+lg("#86cc88","▲ Máximo en 24 meses <b>$"+dec(M.H[M.hi])+"</b> ("+M.hiL+")")+" &nbsp; "+lg("#e0714f","▼ Mínimo <b>$"+dec(M.H[M.lo])+"</b> ("+M.loL+")")+"</p><canvas id='cv' width='680' height='270'></canvas>"+hp("<b>Cómo leer la tabla.</b> «Comprar a» — el precio al que compras el metal, «Vender a» — el precio al que vendes. La diferencia entre ambos (spread) es la comisión del mercado y cambia cada mes. <b>Precio medio de la reserva</b> incluye tanto tus compras como tu producción.<br><b>Gráfico.</b> Cada barra es el precio por gramo al inicio del mes; la última es el precio actual. Las líneas punteadas muestran los precios de tu última compra y venta.<br><b>El corredor</b> ofrece una vez al mes un lote al azar: puede ser más barato o más caro que el mercado.")}
 else h=hd("newspaper","Noticias")+"<table>"+S.news.map(n=>"<tr><td class='m' style='white-space:nowrap'>"+n.d+"</td><td>"+esc(n.t)+"</td></tr>").join("")+"</table>"+hp("Aquí están todos los mensajes de la empresa, los más recientes arriba.");
 $("#main").innerHTML=h;numfy($("#main"));
 if(S.tab=="mk"&&!S.over)chart();
}

let last=performance.now(),acc=0;
function loop(t){const dl=Math.min(t-last,5000);last=t;if(run()){acc+=dl*S.spd;let n=0;while(acc>=1500&&run()&&n++<400){acc-=1500;tick()}if(n)render(0)}else acc=0;requestAnimationFrame(loop)}
document.addEventListener("keydown",e=>{if(e.code=="Space"&&!S.modal){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();togglePause()}});
document.addEventListener("keyup",e=>{if(e.code=="Space"&&!S.modal)e.preventDefault()});
document.addEventListener("click",e=>{if(!(e.target.closest&&e.target.closest(".pmw")))closeMenu()});
document.addEventListener("pointerdown",()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume()}catch(e){}},{once:true});
newGame();startScreen();render();requestAnimationFrame(loop);
</script>
